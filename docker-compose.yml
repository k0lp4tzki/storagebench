# docker compose setup for the storagebench controller (controller only).
#
# Usage (pull the CI-published image, no local compile):
#   export STORAGEBENCH_AGENT_TOKEN="choose-a-strong-token"
#   docker compose pull && docker compose up -d
#
# Or build locally from this checkout:
#   docker compose up --build
#
# Then open http://127.0.0.1:8080 in your browser.
#
# The SQLite database is kept in a named volume so results survive restarts.
services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SB_IMAGE:-ghcr.io/k0lp4tzki/storagebench-controller:latest}
    container_name: storagebench-controller
    # Port binding is configurable so a git pull does not reset your choice.
    # Default binds to localhost only. To reach the controller from other
    # machines, set in a .env file next to this compose file:
    #   SB_BIND=0.0.0.0
    #   SB_PORT=8080
    # (SB_BIND=0.0.0.0 exposes it on all host interfaces.)
    ports:
      - "${SB_BIND:-127.0.0.1}:${SB_PORT:-8080}:8080"
    environment:
      # Pre-shared token agents must present. Provided from the host environment
      # so it is never baked into the image. Falls back to a dev value if unset.
      STORAGEBENCH_AGENT_TOKEN: "${STORAGEBENCH_AGENT_TOKEN:-dev-token-change-me}"
      STORAGEBENCH_LISTEN_ADDR: "0.0.0.0:8080"
      STORAGEBENCH_DB_PATH: "/app/data/storagebench.db"
    volumes:
      - controller-data:/app/data
    restart: unless-stopped
    healthcheck:
      # curl is in the image. Do not use bash /dev/tcp: the image's /bin/sh is dash.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  controller-data:
