# Continuous integration: builds the Linux binaries and runs checks.
#
# The platform targets Linux, and this runner is Linux, so a green run here means
# the code compiles and vets cleanly for the deployment target. This is the
# signal to rely on since builds are not produced on the Windows dev machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Write is needed so CI can commit a generated web/package-lock.json back on
  # pushes to main (keeps frontend builds reproducible without a dev machine).
  contents: write
  # Publish job pushes images to GHCR.
  packages: write

jobs:
  build:
    name: build & test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Verify go.mod is tidy
        run: |
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # gofmt is reported but non-blocking: the hard signal we rely on is that
      # the code vets, builds, and tests cleanly for Linux. Run `make fmt`
      # locally to apply formatting.
      - name: gofmt report (non-blocking)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::The following files are not gofmt'ed (run 'make fmt'):"
            echo "$unformatted"
          fi

      - name: Build frontend
        run: make web-build

      - name: Commit generated package-lock.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add web/package-lock.json
          # --cached catches both new (untracked, now staged) and modified files.
          if ! git diff --cached --quiet -- web/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: update web/package-lock.json [skip ci]"
            git push
          fi

      - name: Build (agent + controller)
        run: make build

      - name: Build controller with embedded UI
        run: make build-controller-embed

      - name: Test
        run: go test ./...

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-binaries
          path: |
            bin/storagebench-agent
            bin/storagebench-broker
            bin/storagebench-controller
          if-no-files-found: error

  publish:
    name: publish GHCR images & nightly binaries
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64-binaries
          path: artifacts

      - name: Lowercase image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/storagebench-controller:latest
            ghcr.io/${{ env.OWNER }}/storagebench-controller:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Prepare agent/broker image contexts
        run: |
          # upload-artifact@v4 strips the common parent (bin/), so the files land
          # as artifacts/storagebench-agent (not artifacts/bin/...). Locate them
          # regardless of layout and copy to canonical paths.
          echo "artifact tree:" && find artifacts -type f -print
          AGENT="$(find artifacts -type f -name 'storagebench-agent' | head -n1)"
          BROKER="$(find artifacts -type f -name 'storagebench-broker' | head -n1)"
          CONTROLLER="$(find artifacts -type f -name 'storagebench-controller' | head -n1)"
          test -n "$AGENT" && test -n "$BROKER" && test -n "$CONTROLLER"
          mkdir -p bin .img/agent .img/broker
          cp "$AGENT" bin/storagebench-agent
          cp "$BROKER" bin/storagebench-broker
          cp "$CONTROLLER" bin/storagebench-controller
          cp "$AGENT" .img/agent/storagebench-agent
          cp "$BROKER" .img/broker/storagebench-broker
          chmod 0755 bin/storagebench-agent bin/storagebench-broker bin/storagebench-controller \
            .img/agent/storagebench-agent .img/broker/storagebench-broker

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .img/agent
          file: deploy/docker/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/storagebench-agent:latest
            ghcr.io/${{ env.OWNER }}/storagebench-agent:${{ github.sha }}

      - name: Build and push broker image
        uses: docker/build-push-action@v6
        with:
          context: .img/broker
          file: deploy/docker/Dockerfile.broker
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/storagebench-broker:latest
            ghcr.io/${{ env.OWNER }}/storagebench-broker:${{ github.sha }}

      - name: Publish nightly GitHub Release (static binaries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp bin/storagebench-agent dist/storagebench-agent-linux-amd64
          cp bin/storagebench-broker dist/storagebench-broker-linux-amd64
          cp bin/storagebench-controller dist/storagebench-controller-linux-amd64
          NOTES="Nightly binaries + GHCR images from ${GITHUB_SHA}

          Images (preferred for the controller):
            ghcr.io/${OWNER}/storagebench-controller:latest
            ghcr.io/${OWNER}/storagebench-agent:latest
            ghcr.io/${OWNER}/storagebench-broker:latest

          Binaries in this release:
            storagebench-agent-linux-amd64      (static)
            storagebench-broker-linux-amd64     (static)
            storagebench-controller-linux-amd64 (needs glibc; UI embedded)

          Controller via Docker:
            docker pull ghcr.io/${OWNER}/storagebench-controller:latest
            docker compose pull && docker compose up -d

          SLES hosts can install agent/broker without compiling:
            sudo ./deploy/agent/install-agent-sles.sh --controller ... --token ...
            sudo ./deploy/broker/install-broker-sles.sh
          "
          ASSETS="dist/storagebench-agent-linux-amd64 dist/storagebench-broker-linux-amd64 dist/storagebench-controller-linux-amd64"
          if gh release view nightly >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload nightly $ASSETS --clobber
            gh release edit nightly --notes "$NOTES"
          else
            # shellcheck disable=SC2086
            gh release create nightly $ASSETS --title "nightly" --notes "$NOTES" --latest
          fi

